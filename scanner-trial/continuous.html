<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="../manifest.webmanifest"><title>連続スキャナー v304</title><link rel="stylesheet" href="continuous.css?v=304"></head>
<body><header><a href="../">← 戻る</a><strong>連続スキャン</strong><a href="index.html?mode=legacy">旧方式</a></header>
<main><section id="camera"><video id="video" autoplay muted playsinline></video><svg id="guide" preserveAspectRatio="xMidYMid meet"><polygon id="outline" fill="none" stroke="#64e8a5" stroke-width="5"/></svg>
<div id="result" hidden><img id="thumb" alt=""><div><strong id="name"></strong><p id="resultStatus"></p></div></div>
<div id="controls"><p id="status" role="status">カードの四隅を映してください</p><div class="buttons"><button id="more" disabled>もう1枚</button><button id="undo" disabled>直前を取消</button><button id="review">リスト 0枚</button></div></div></section>
<section class="toolbar"><label>言語<select id="language"><option value="ja">日本語</option><option value="en">英語</option><option value="auto">自動判定</option></select></label><label>仕様<select id="finish"><option value="normal">通常</option><option value="foil">Foil</option><option value="etched">エッチング</option></select></label><button id="start">開始</button><button id="stop">停止</button><button id="rescan">再読取</button></section>
<details><summary>診断・使い方（v304）</summary><p>画像照合でカード自体を特定したら仮登録します。収録版・言語・仕様はリストで確認後に所持カードへ保存します。同じ種類は「もう1枚」で追加してください。自動判定できない言語は要確認です。写真は送信しません。</p><p>旧方式のリストと新方式のリストは別です。切替後もそれぞれ残ります。</p><button id="export">計測ログを保存</button><p>直近100回の処理時間のみ保持します。正解率は実カードとの比較が必要です。</p></details>
<dialog id="list"><h2>スキャンリスト</h2><p id="message" role="status"></p><div id="rows"></div><button id="commit">確認済みリストを所持カードへ保存</button><button id="close">カメラに戻る</button></dialog>
</main><canvas id="capture" hidden></canvas><script>window.MTG_STORAGE_TEST=true;</script><script src="../storage.js?v=304"></script><script src="quick-store.js?v=304"></script><script src="scanner-language.js?v=304"></script><script src="continuous-flow.js?v=304"></script><script src="continuous-store.js?v=304"></script><script src="continuous.js?v=304"></script></body></html>
