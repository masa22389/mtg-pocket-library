<!doctype html><meta charset="utf-8"><title>Storage migration tests</title>
<button id="run">保存・移行テストを実行</button><pre id="results">未実行</pre>
<script>window.MTG_STORAGE_TEST=true;</script><script src="../storage.js"></script>
<script>
const output=document.querySelector('#results');
const check=(ok,label)=>{if(!ok)throw Error(label);output.textContent+='PASS: '+label+'\n';};
const legacyOf=entries=>({length:entries.length,key:i=>entries[i][0],getItem:key=>entries.find(x=>x[0]===key)?.[1]??null});
document.querySelector('#run').onclick=async()=>{
 document.querySelector('#run').disabled=true;output.textContent='';
 const name='mtg-storage-test-'+crypto.randomUUID();let store,peer;
 const entries=[['mtg-pocket.collection.v1','[{"name":"テスト","quantity":4}]'],['mtg-pocket.decks.v1','[{"versions":[{"number":1}]}]'],['mtg-pocket.purchases.v1','[]'],['mtg-pocket.backgroundTheme','blue'],['unrelated','keep']];
 try {
  store=await createMtgStorage({name,legacy:legacyOf(entries)});
  check(entries.slice(0,4).every(([k,v])=>store.getItem(k)===v),'legacy JSON and raw preferences migrated exactly');
  check(store.getItem('unrelated')===null,'other app data excluded');
  check(entries[0][1].includes('quantity'),'legacy source unchanged');
  const large='日本語'.repeat(2*1024*1024);
  await store.setItem('mtg-pocket.large-test',large);check(store.getItem('mtg-pocket.large-test')===large,'data exceeding localStorage quota saved');
  await store.writeBatch([['mtg-pocket.collection.v1','new collection'],['mtg-pocket.purchases.v1','new purchases']]);
  await Promise.all([store.setItem('mtg-pocket.sequence','1'),store.setItem('mtg-pocket.sequence','2')]);
  store.close();store=await createMtgStorage({name,legacy:legacyOf(entries)});
  check(store.getItem('mtg-pocket.large-test')===large,'large data survives reopening');
  check(store.getItem('mtg-pocket.collection.v1')==='new collection','reopening does not overwrite from old legacy');
  check(store.getItem('mtg-pocket.purchases.v1')==='new purchases'&&store.getItem('mtg-pocket.sequence')==='2','atomic purchase transfer and ordered writes');
  let rejected=false;try{await store.writeBatch([['mtg-pocket.collection.v1','must rollback'],[null,'invalid key']]);}catch{rejected=true;}
  check(rejected&&store.getItem('mtg-pocket.collection.v1')==='new collection','failed transaction leaves cache unchanged');
  store.close();store=await createMtgStorage({name,legacy:legacyOf(entries)});check(store.getItem('mtg-pocket.collection.v1')==='new collection','failed transaction leaves durable data unchanged');
  const retryName=name+'-retry';
  let migrationFailed=false;
  try{await createMtgStorage({name:retryName,legacy:{length:2,key:i=>entries[i][0],getItem:key=>{if(key.includes('decks'))throw Error('migration interrupted');return 'partial';}}});}catch{migrationFailed=true;}
  peer=await createMtgStorage({name:retryName,legacy:legacyOf(entries)});
  check(migrationFailed&&peer.getItem(entries[0][0])===entries[0][1]&&peer.getItem(entries[1][0])===entries[1][1],'interrupted migration rolls back marker and retries completely');
  peer.close();indexedDB.deleteDatabase(retryName);
  output.textContent+='ALL PASSED';
 }catch(error){output.textContent+='FAIL: '+error.stack;}finally{store?.close();indexedDB.deleteDatabase(name);document.querySelector('#run').disabled=false;}
};
</script>
